<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<meta charset="utf-8">
<title>O Milhano · animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --abismo:#07090d;--lanterna:#E3A44C;--papel:#E9E3D5;--papel-fraco:#9AA6B0;--sangue:#B4302A;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --caps:'Cinzel','Trajan Pro',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --esc:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--abismo);color:var(--papel);font-family:var(--serif);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .6s}
/* barras de cinema */
.barra{position:fixed;left:0;right:0;height:0;background:#000;z-index:3;transition:height 1.1s cubic-bezier(.6,0,.2,1);pointer-events:none}
.barra.cima{top:0}.barra.baixo{bottom:0}
body.cinema .barra{height:11vh}
/* sombra suave em baixo quando há legenda */
#sombra{position:fixed;left:0;right:0;bottom:0;height:45vh;z-index:4;pointer-events:none;opacity:0;transition:opacity .7s;
  background:linear-gradient(0deg,rgba(5,7,10,.75) 0%,rgba(5,7,10,.45) 45%,rgba(5,7,10,0) 100%)}
body.comleg #sombra{opacity:1}
/* legendas */
#leg{position:fixed;left:50%;bottom:calc(16vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:min(92vw,46rem);text-align:center;z-index:5;
  opacity:0;transition:opacity .45s,transform .45s;pointer-events:none}
#leg.on{opacity:1;transform:translate(-50%,0)}

#leg .quem{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lanterna);margin-bottom:6px;text-shadow:0 1px 6px #000}
#leg p{margin:0;font-style:italic;font-weight:400;font-size:calc(clamp(1.3rem,3vw,2.6rem)*var(--esc));line-height:1.35;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 2px #000,0 0 28px rgba(0,0,0,.7);text-wrap:balance}
#leg.fala p{font-style:normal}
#leg.centro{bottom:auto;top:50%;transform:translate(-50%,-40%)}#leg.centro.on{transform:translate(-50%,-50%)}
#leg.centro p{font-style:normal;font-family:var(--serif);font-weight:300}
#leg.grande.on p{animation:bate .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bate{0%{transform:scale(1.25);filter:blur(6px);opacity:0}100%{transform:scale(1);filter:none;opacity:1}}
#cartao p.forte.on,#cartao p.nome.on{animation:bate .6s cubic-bezier(.2,.8,.2,1)}
#leg.grande p{font-family:var(--caps);font-style:normal;font-weight:700;letter-spacing:.06em;font-size:calc(clamp(1.8rem,5vw,3.6rem)*var(--esc))}
/* cartão negro */
#cartao{position:fixed;inset:0;background:#000;z-index:6;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .8s}
#cartao.on{opacity:1}
#cartao p{margin:0;padding:0 8vw;text-align:center;font-family:'IM Fell English',var(--serif);font-style:italic;font-weight:400;font-size:calc(clamp(1.5rem,3.6vw,2.6rem)*var(--esc));line-height:1.3;color:var(--papel);opacity:0;transition:opacity 1s;text-wrap:balance}
#cartao p.on{opacity:1}
#cartao p.forte{font-family:'IM Fell English',var(--serif);font-style:normal;font-weight:400;letter-spacing:.02em;font-size:calc(clamp(2.4rem,8vw,6rem)*var(--esc))}
#cartao p.nome{font-family:'IM Fell English',var(--serif);font-style:normal;font-weight:400;letter-spacing:.04em;color:var(--sangue);font-size:calc(clamp(2.4rem,8vw,6rem)*var(--esc))}
/* flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none}
/* dica de gesto */
#dica{position:fixed;left:50%;top:18vh;transform:translateX(-50%);z-index:5;font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--papel);
  padding:10px 16px;border:1px solid rgba(233,227,213,.35);background:rgba(7,9,13,.45);opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#dica.on{opacity:1;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{border-color:var(--lanterna);color:var(--lanterna)}}
/* escolhas */
#escolha{position:fixed;left:50%;width:min(92vw,720px);bottom:calc(14vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#escolha.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#escolha .ops{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#escolha button{font-family:var(--caps);font-weight:700;font-size:clamp(.85rem,1.6vw,1.05rem);letter-spacing:.14em;text-transform:uppercase;color:var(--papel);background:rgba(7,9,13,.62);
  border:1px solid rgba(233,227,213,.45);padding:14px 22px;cursor:pointer;min-width:200px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#escolha button:hover,#escolha button:focus-visible{border-color:var(--lanterna);color:var(--lanterna);outline:none}
#escolha button b{display:inline-block;margin-right:10px;color:var(--lanterna)}
#escolha .tempo{width:min(440px,70vw);height:2px;background:rgba(233,227,213,.18)}
#escolha .tempo i{display:block;height:100%;background:var(--lanterna);transform-origin:left}
/* rodar o telemóvel */
#rodar{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;background:rgba(5,6,8,.96)}
@media (orientation:portrait) and (pointer:coarse){#rodar:not(.fora){display:flex}}
#rodar svg{width:72px;height:72px;color:var(--lanterna);animation:roda 2.4s ease-in-out infinite}
@keyframes roda{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#rodar p{margin:0;font-family:var(--caps);font-weight:700;font-size:1.2rem;letter-spacing:.14em;text-transform:uppercase}
#rodar small{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--papel-fraco)}
#rodar button{margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--papel-fraco);background:none;border:1px solid rgba(233,227,213,.25);padding:10px 14px}
/* balões provisórios */
#balao{position:fixed;z-index:6;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
#balao.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#balao .b{min-width:78px;min-height:64px;display:grid;place-items:center;padding:10px 16px;background:#f4efe3;border:3px solid #1a1410;border-radius:40px;position:relative}
#balao .b::after{content:'';position:absolute;left:28%;bottom:-16px;border:9px solid transparent;border-top:16px solid #1a1410;border-bottom:0}
#balao span{display:block;text-align:center;margin-top:18px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px #000;opacity:.8}
/* o que é verdade */
#verdade .factos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;width:min(100%,980px)}
#verdade h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lanterna);font-weight:500}
#verdade ul{margin:0;padding-left:18px;font-size:clamp(.98rem,1.4vw,1.1rem);line-height:1.55;color:var(--papel)}
#verdade li{margin-bottom:8px}
/* INTRO: bloco de texto de cinema */
#bloco{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;padding:0 max(24px,8vw)}
#bloco .col{max-width:34em;font-family:var(--serif);font-size:calc(clamp(1.05rem,2vw,1.6rem)*var(--esc));line-height:1.6;color:var(--papel);text-align:left}
#bloco .col span{display:block;margin:0 0 .55em;opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease}
#bloco .col span.on{opacity:.92;transform:none}
#bloco .col span.data{font-family:var(--mono);font-size:.62em;letter-spacing:.3em;text-transform:uppercase;color:var(--lanterna);margin-bottom:1.4em}
#bloco.sai .col span{opacity:0;transition:opacity 1.4s ease}
/* CAIXAS DE RECITATIVO (BD) */
#caixas{position:fixed;inset:0;z-index:6;pointer-events:none}
.caixa{position:absolute;max-width:min(30ch,42vw);padding:.55em .8em;background:#e6dfcf;color:#15110d;border:2px solid #15110d;box-shadow:4px 4px 0 rgba(0,0,0,.55);
  font:italic 500 calc(clamp(.95rem,1.7vw,1.45rem)*var(--esc))/1.35 var(--serif);opacity:0;transform:translateY(-6px);transition:opacity .45s ease,transform .45s ease}
.caixa.on{opacity:1;transform:none}
.caixa.forte{font-style:normal;font-weight:700;font-size:calc(clamp(1.3rem,2.6vw,2.2rem)*var(--esc));max-width:min(24ch,70vw);text-align:center}
.caixa.sai{opacity:0;transition:opacity .6s}
#seta{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(14px + 54px);z-index:6;font:600 26px/1 var(--serif);color:var(--lanterna);opacity:0;pointer-events:none;transition:opacity .4s}
#seta.on{opacity:.9;animation:seta 1.4s ease-in-out infinite}
@keyframes seta{50%{transform:translateX(6px)}}
body.explora #caixas,body.explora #seta,body.explora #bloco{opacity:0}
/* EXPLORAR (na pausa) */
#explora{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .5s}
body.explora #explora{opacity:1}
body.explora #leg,body.explora #sombra,body.explora .hud{opacity:0!important;pointer-events:none}
body.explora #cv{cursor:grab}body.explora #cv:active{cursor:grabbing}
body.explora #explora .topo .btn{pointer-events:auto}
#explora .topo .btn{pointer-events:none}
#explora .dica{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--papel);background:rgba(7,9,13,.55);padding:8px 14px;white-space:nowrap}
.marca{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid var(--lanterna);background:rgba(7,9,13,.35);pointer-events:auto;cursor:pointer;
  display:grid;place-items:center;color:var(--lanterna);font:600 15px/1 var(--serif);animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 8px rgba(227,164,76,0)}0%,100%{box-shadow:0 0 0 0 rgba(227,164,76,.45)}}
.marca .txt{position:absolute;left:38px;top:50%;transform:translateY(-50%);width:min(300px,60vw);padding:12px 14px;background:rgba(7,9,13,.85);border-left:2px solid var(--lanterna);
  font:italic 400 15px/1.45 var(--serif);color:var(--papel);text-align:left;opacity:0;pointer-events:none;transition:opacity .3s}
.marca.dir .txt{left:auto;right:38px;border-left:0;border-right:2px solid var(--lanterna)}
.marca.on .txt{opacity:1}
/* HUD */
.hud{position:fixed;inset:0;z-index:7;pointer-events:none;transition:opacity .6s}
.hud.fora{opacity:0}
.btn{pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--papel);background:rgba(7,9,13,.4);
  border:1px solid rgba(233,227,213,.28);padding:10px 14px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--lanterna)}
.btn.ico{padding:9px 11px;display:inline-grid;place-items:center}
.topo{position:absolute;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between}
.topo .direita{display:flex;gap:8px}
.hud .btn{opacity:.75;transition:opacity .3s}.hud .btn:hover{opacity:1}
body.limpo .hud{opacity:0;transition:opacity .8s}
body.limpo.mexeu .hud{opacity:1;transition:opacity .2s}
body.limpo .hud .plano{display:none}
.nav{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px}
#bSeguir{border-color:var(--lanterna)}
.plano{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--papel-fraco)}
.plano b{color:var(--papel);font-weight:500}
/* ecrãs */
.ecra{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:safe center;align-items:flex-start;gap:1.1rem;
  padding:6vh max(24px,8vw);background:linear-gradient(90deg,rgba(7,9,13,.96),rgba(7,9,13,.82) 50%,rgba(7,9,13,.4));transition:opacity .8s;overflow-y:auto}
.ecra.fora{opacity:0;pointer-events:none}
.ecra .ep{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--lanterna)}
.ecra h1{margin:0;font-family:var(--caps);font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1;font-size:min(clamp(2.2rem,6vw,5rem),8.6vw);white-space:nowrap}
.ecra .sub{margin:0;font-style:italic;font-size:clamp(1.05rem,1.8vw,1.35rem);max-width:40ch}
.ecra .menu{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;margin-top:.6rem}
.ecra .cta{font-family:var(--caps);font-weight:700;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;background:var(--lanterna);color:var(--abismo);border:0;padding:14px 40px;cursor:pointer;margin-bottom:.5rem}
.ecra .item{font-family:var(--caps);font-weight:700;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--papel);background:none;border:0;border-left:2px solid transparent;padding:6px 12px;cursor:pointer}
.ecra .item:hover{border-left-color:var(--lanterna);color:var(--lanterna)}
.ecra .nota{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--papel-fraco);margin-top:.6rem}
.planos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;width:min(100%,640px)}
.planos button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--papel);background:rgba(255,255,255,.04);border:1px solid rgba(233,227,213,.18);padding:10px;cursor:pointer}
.planos button:hover{border-color:var(--lanterna)}
.planos button b{display:block;color:var(--lanterna);font-weight:500;margin-bottom:2px}
@media (max-height:560px){.ecra{gap:.6rem}.ecra .sub{display:none}}
@media (max-width:640px){#leg{bottom:calc(18vh + env(safe-area-inset-bottom,0px))}.plano{display:none}}
</style>

<canvas id="cv"></canvas>
<div class="barra cima"></div><div class="barra baixo"></div>
<div id="flash"></div>
<div id="sombra"></div>
<div id="leg"><span class="quem"></span><p></p></div>
<div id="dica"></div>
<div id="cartao"><p></p></div>
<div id="escolha"><div class="ops"><button type="button"></button><button type="button"></button></div><div class="tempo"><i></i></div></div>
<div id="rodar"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="15" y="6" width="18" height="36" rx="3"/><path d="M22 37h4"/></svg>
  <p>Roda o ecrã</p><small>Isto é para ver deitado, como um filme.</small><button type="button" id="bRodar">Ver assim mesmo</button></div>

<div class="hud fora" id="hud">
  <div class="topo">
    <button class="btn ico" id="bMenu" type="button" aria-label="Pausa" title="Pausa (Esc)"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
    <span class="direita">
      <button class="btn ico" id="bLimpo" type="button" aria-label="Esconder interface" title="Esconder interface (H)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="btn ico" id="bEcra" type="button" aria-label="Ecrã inteiro" title="Ecrã inteiro (F)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </span>
  </div>
  <div class="plano"><b id="nPlano">1</b> / <span id="nTotal">13</span> · <span id="tPlano">Tempestade</span></div>
  <div class="nav">
    <button class="btn" id="bVoltar" type="button">‹ Voltar</button>
    <button class="btn" id="bSeguir" type="button">Continuar ›</button>
  </div>
</div>

<section class="ecra" id="titulo">
  <div class="ep">Piloto · O Milhano · animatic</div>
  <h1>Dezassete vezes<br>vendido</h1>
  <p class="sub">A vida de Fernão Mendes Pinto, ou como comer bem onde era suposto morrer.</p>
  <div class="menu">
    <button class="cta" id="bComecar" type="button">Começar</button>
    <button class="item" id="bRecomecar" type="button" hidden>Recomeçar</button>
    <button class="item" id="bExplorar" type="button" hidden>Explorar a imagem</button>
    <button class="item" id="bPlanos" type="button">Escolher plano</button>
    <button class="item" id="bModo" type="button">Modo: ler</button>
    <button class="item" id="bEcra2" type="button">Ecrã inteiro</button>
    <button class="item" id="bLetra" type="button">Legendas: média</button>
  </div>
  <div class="planos" id="listaPlanos" hidden></div>
  <div class="nota">Melhor com auscultadores · ecrã deitado · desenhos provisórios</div>
</section>
<script>
'use strict';
/* =========================================================
   MOTOR · canvas, câmara, vistas, guião, gestos
   ========================================================= */
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
let W=0,H=0,DPR=1;
function redimensiona(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',redimensiona);redimensiona();

/* ---------- ruído para desenho à mão ---------- */
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function ruido1(x,seed=0){const i=Math.floor(x),f=x-i,h=n=>{const v=Math.sin((n+seed*57.1)*127.1)*43758.5453;return v-Math.floor(v)};const u=f*f*(3-2*f);return lerp(h(i),h(i+1),u)}

/* ---------- grão ---------- */
const grao=document.createElement('canvas');grao.width=grao.height=160;
{const g=grao.getContext('2d'),d=g.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=18}g.putImageData(d,0,0)}

/* ---------- câmara ----------
   Cada vista desenha um "mundo" (W×H em unidades próprias) que cobre o retângulo.
   cam.x/cam.y = ponto do mundo no centro (0..1), cam.z = zoom, cam.r = rotação. */
function novaCam(o={}){return Object.assign({x:.5,y:.5,z:1,r:0,ax:0,ay:0},o)}
function aplicaCam(c,rect,mundo,cam,extraZ=1){
  const s=Math.max(rect.h/mundo.H,rect.w/mundo.W)*cam.z*extraZ*1.06;
  const vw=rect.w/s,vh=rect.h/s;
  let px=cam.x*mundo.W,py=cam.y*mundo.H;
  px=clamp(px,vw/2,mundo.W-vw/2);py=clamp(py,vh/2,mundo.H-vh/2);
  c.translate(rect.x+rect.w/2,rect.y+rect.h/2);c.rotate(cam.r);c.scale(s,s);c.translate(-px,-py);
  return {s,px,py,vw,vh};
}
/* desenha uma vista num retângulo do ecrã */

function direcao(al,be,ga,orient){

  const mul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1], a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0], a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3], a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];

function montaVinhetas(paineis,o={}){vinhetas={t0:T,papel:o.papel,parte:o.parte,base:o.base||{x:.5,y:.5,z:1},paineis:paineis.map(p=>Object.assign({cam:novaCam(p.cam0)},p))};}

/* ---------- ciclo ---------- */
function ciclo(agora){

  const k=1-Math.pow(.0015,dt);
  for(const q of ['x','y','z','r'])cam[q]=lerp(cam[q],alvo[q],k*(q==='z'?.6:1));
  cam.ax=lerp(cam.ax,alvo.ax,1-Math.pow(.02,dt));cam.ay=lerp(cam.ay,alvo.ay,1-Math.pow(.02,dt));
  tremor*=Math.pow(.25,dt);flashV*=Math.pow(.02,dt);
  const sh=tremor*(fx.congela?0:1);
  const c2=novaCam({x:cam.x+cam.ax*.5/Math.max(1,cam.z)+(Math.random()-.5)*.012*sh,y:cam.y+cam.ay*.5/Math.max(1,cam.z)+(Math.random()-.5)*.012*sh+Math.sin(T*1.3)*.004*respira,
    z:cam.z*(1+.006*respira*Math.sin(T*1.25))*(1+fx.pulso*.03*Math.pow(Math.max(0,Math.sin(T*Math.PI*2*1.15)),12)),
    r:cam.r+Math.sin(T*.8)*.025*balanco+Math.sin(T*.37)*.012*balanco+(Math.random()-.5)*.01*sh});

  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(!cena&&M_TEMP.img.complete){vista(M_TEMP,novaCam({x:.62,y:.45,z:1.05+Math.sin(agora/4000)*.02}),{x:0,y:0,w:W,h:H},agora/1000)}
  if(cena){
    if(vinhetas)desenhaVinhetas(TD);
    else if(cena.mundo)vista(cena.mundo,c2,{x:0,y:0,w:W,h:H},TD);
    if(cena.ecra)cena.ecra(cx,TD);
  }
  /* pós-processamento */
  if(fx.dobra>0){const d=fx.dobra;cx.globalCompositeOperation='multiply';cx.fillStyle=`rgba(150,170,90,${.35*d})`;cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over'}
  if(fx.tinta&&fx.tintaA>0){cx.fillStyle=fx.tinta;cx.globalAlpha=fx.tintaA;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${.55+fx.escuro*.4})`);

  cx.globalAlpha=1;const pat=cx.createPattern(grao,'repeat');cx.save();cx.translate(Math.random()*160,Math.random()*160);cx.fillStyle=pat;cx.fillRect(-160,-160,W+320,H+320);cx.restore();
  $('#flash').style.opacity=Math.min(1,flashV);
  const blur=fx.desfoque+(fx.dobra*3);cv.style.filter=blur>.2?`blur(${blur.toFixed(1)}px)`:'none';
  if(!pausado)somCiclo(dt);
  requestAnimationFrame(ciclo);
}

  TR.g={};['pad','piano','pulso','perc','trem'].forEach(k=>{const g=AC.createGain();g.gain.value=0;g.connect(mestreT);TR.g[k]=g});
  TR.prox=AC.currentTime+.1;TR.timer=setInterval(trilhaAgenda,30)}
function trilhaGanhos(tc){const n=Math.min(4,Math.max(0,TR.alvo+TR.pico)),i=Math.floor(n),f=n-i,a=NIVEIS[i],b=NIVEIS[Math.min(4,i+1)];
  ['pad','piano','pulso','perc','trem'].forEach((k,j)=>TR.g[k].gain.setTargetAtTime(lerp(a[j],b[j],f),AC.currentTime,tc));TR.nivel=n}
function trilha(n,tc=1.5){if(!AC)return;trilhaInicia();TR.alvo=n;trilhaGanhos(tc)}
function trilhaPico(d=1,seg=3){if(!AC||!TR.g)return;TR.pico=d;trilhaGanhos(.15);clearTimeout(trilhaPico.t);trilhaPico.t=setTimeout(()=>{TR.pico=0;trilhaGanhos(1.5)},seg*1000/VEL)}
function nota(dest,fq,t,dur,tipo,vol,lp){const o=AC.createOscillator(),g=AC.createGain();o.type=tipo;o.frequency.value=fq;let n=o;
  if(lp){const f=filt('lowpass',lp);o.connect(f);n=f}n.connect(g);g.connect(dest);return{o,g}}
function trilhaAgenda(){if(!AC||AC.state!=='running')return;const ativo=k=>TR.g[k].gain.value>.008||TR.nivel>0;
  while(TR.prox<AC.currentTime+.15){const p=TR.passo,t=TR.prox,cmp=Math.floor(p/8),b=p%8,acorde=PROG[Math.floor(cmp/2)%4];
    if(TR.nivel>.05){
      /* cordas: acorde longo de 2 compassos */
      if(p%16===0)acorde.forEach((fq,i)=>[1,1.006].forEach(dt=>{const {o,g}=nota(TR.g.pad,fq*dt,t,8,'sawtooth',0,900);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.6);g.gain.setValueAtTime(.05,t+6.5);g.gain.linearRampToValueAtTime(0,t+7.9);o.start(t);o.stop(t+8)}));
      /* piano: motivo */
      const mi=MOTIVO[p%16];if(mi!=null){const fq=ESCALA[mi]*(cmp%4===3?1.0:1);[1,2].forEach((h,i)=>{const {o,g}=nota(TR.g.piano,fq*h,t,2.6,i?'sine':'triangle',0);g.connect(rev);g.gain.setValueAtTime(i?.05:.16,t);g.gain.exponentialRampToValueAtTime(.0005,t+2.6);o.start(t);o.stop(t+2.7)})}
      /* pulso grave em colcheias */
      if(TR.g.pulso.gain.value>.01||TR.alvo>=2){const {o,g}=nota(TR.g.pulso,acorde[0]/2,t,.2,'sawtooth',0,420);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.25)}
      /* percussão */
      if(TR.g.perc.gain.value>.01||TR.alvo>=3){if(b===0||b===3||(b===5&&cmp%2))taikoEm(t,b===0?1:.6);if(b===6||b===7)ruidoEm(t,.12)}
      /* trémulo agudo */
      if((TR.g.trem.gain.value>.01||TR.alvo>=4)&&p%4===0)acorde.forEach(fq=>{const {o,g}=nota(TR.g.trem,fq*2,t,1,'sawtooth',0,2500);const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=13;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);
        g.gain.setValueAtTime(.03,t);g.gain.linearRampToValueAtTime(0,t+1);o.start(t);o.stop(t+1.05);l.start(t);l.stop(t+1.05)});
    }
    TR.passo++;TR.prox+=60/76/2}}
function taikoEm(t,f){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(105,t);o.frequency.exponentialRampToValueAtTime(42,t+.35);o.connect(g);g.connect(TR.g.perc);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.8*f,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.start(t);o.stop(t+.85)}
function ruidoEm(t,v){const s=AC.createBufferSource();s.buffer=BW;const f=filt('bandpass',2600,2),g=AC.createGain();s.connect(f);f.connect(g);g.connect(TR.g.perc);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);s.start(t,Math.random());s.stop(t+.08)}

addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')setLimpo(!limpo);if(e.key==='f'||e.key==='F')ecraInteiro();if((e.key==='p'||e.key==='P')&&comecou)pausado?retoma():pausa()});

/* ---------- tamanho das legendas ---------- */
const TAM=[['pequena',.82],['média',1],['grande',1.25],['muito grande',1.5]];let iTam=1;
function aplicaTam(){document.documentElement.style.setProperty('--esc',TAM[iTam][1]);$('#bLetra').textContent='Legendas: '+TAM[iTam][0];try{localStorage.setItem('milhano-letra',iTam)}catch(e){}}
try{const v=localStorage.getItem('milhano-letra');if(v!==null&&TAM[+v])iTam=+v}catch(e){}
aplicaTam();$('#bLetra').addEventListener('click',()=>{iTam=(iTam+1)%TAM.length;aplicaTam()});

/* =========================================================
   OLHAR · o rato guia o olhar do Fernão; na pausa, explorar a imagem
   ========================================================= */
/* ---------- 1. durante o filme: a câmara segue o rato de leve ---------- */
const OLHAR={ax:0,ay:0,x:0,y:0};
const ratoFino=matchMedia('(pointer:fine)').matches;
addEventListener('pointermove',e=>{if(!ratoFino)return;OLHAR.ax=(e.clientX/innerWidth-.5)*2;OLHAR.ay=(e.clientY/innerHeight-.5)*2});
document.addEventListener('pointerleave',()=>{OLHAR.ax=0;OLHAR.ay=0});

/* ---------- 2. na pausa: explorar a imagem ---------- */
const NOTAS=new Map([
  [M_TEMP,[
    {x:.062,y:.3,t:'Lanterna de corno. O vidro era caro; a luz passava por lâminas finas de corno raspado.'},
    {x:.62,y:.42,dir:true,t:'Juncos chineses. Os portugueses compravam ou tomavam estes barcos e navegavam-nos com velas de esteira e bambu.'}]]
]);
let explorando=false;const EX={x:.5,y:.5,z:1,toques:new Map(),d0:0,z0:1};
const exEl=document.createElement('div');exEl.id='explora';
exEl.innerHTML='<div class="topo"><button class="btn" id="bSairExp" type="button">‹ Voltar ao menu</button><span></span></div><div class="marcas"></div><div class="dica">Arrasta para olhar · roda ou pinça para aproximar</div>';
document.body.appendChild(exEl);
const marcasEl=exEl.querySelector('.marcas');
function mundoAtual(){return cena&&cena.mundo}
function limitaEX(){const m=mundoAtual();if(!m)return;EX.z=clamp(EX.z,1,3.2);const s=Math.max(H/m.H,W/m.W)*EX.z*1.06;const fx=W/s/m.W,fy=H/s/m.H;
  EX.x=clamp(EX.x,fx/2,1-fx/2);EX.y=clamp(EX.y,fy/2,1-fy/2)}
function abreExplorar(){const m=mundoAtual();if(!m)return;explorando=true;Object.assign(EX,{x:cam.x,y:cam.y,z:Math.max(1,cam.z)});limitaEX();
  titulo.classList.add('fora');document.body.classList.add('explora');
  marcasEl.innerHTML=(NOTAS.get(m)||[]).map((n,i)=>`<div class="marca${n.dir?' dir':''}" data-i="${i}">+<div class="txt">${n.t}</div></div>`).join('')}
function fechaExplorar(){explorando=false;alvo.ax=0;alvo.ay=0;document.body.classList.remove('explora');marcasEl.innerHTML='';titulo.classList.remove('fora')}
$('#bExplorar').addEventListener('click',abreExplorar);
$('#bSairExp').addEventListener('click',fechaExplorar);
marcasEl.addEventListener('click',e=>{const m=e.target.closest('.marca');if(!m)return;const on=!m.classList.contains('on');marcasEl.querySelectorAll('.marca').forEach(x=>x.classList.remove('on'));if(on)m.classList.add('on')});
addEventListener('keydown',e=>{if(explorando&&(e.key==='Escape'||e.key==='p'||e.key==='P')){e.stopImmediatePropagation();fechaExplorar()}},true);
/* o botão só aparece quando há imagem para explorar */
{const _pausa=pausa;pausa=function(){_pausa();$('#bExplorar').hidden=!mundoAtual()}}
{const _ret=retoma;retoma=function(){if(explorando)fechaExplorar();$('#bExplorar').hidden=true;_ret()}}
$('#bMenu').addEventListener('click',()=>{$('#bExplorar').hidden=!mundoAtual()});
{const _fim=fimEpisodio;fimEpisodio=function(){$('#bExplorar').hidden=true;_fim()}}
/* arrastar e aproximar */
cv.addEventListener('pointerdown',e=>{if(!explorando)return;EX.toques.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(EX.toques.size===2){const [a,b]=[...EX.toques.values()];EX.d0=Math.hypot(a.x-b.x,a.y-b.y);EX.z0=EX.z}});
cv.addEventListener('pointermove',e=>{if(!explorando||!EX.toques.has(e.pointerId))return;const p=EX.toques.get(e.pointerId),m=mundoAtual();
  if(EX.toques.size===1&&m){const s=Math.max(H/m.H,W/m.W)*EX.z*1.06;EX.x-=(e.clientX-p.x)/s/m.W;EX.y-=(e.clientY-p.y)/s/m.H}
  p.x=e.clientX;p.y=e.clientY;
  if(EX.toques.size===2){const [a,b]=[...EX.toques.values()];EX.z=EX.z0*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,EX.d0)}
  limitaEX()});
const largaToque=e=>EX.toques.delete(e.pointerId);
cv.addEventListener('pointerup',largaToque);cv.addEventListener('pointercancel',largaToque);
cv.addEventListener('wheel',e=>{if(!explorando)return;e.preventDefault();EX.z*=Math.exp(-e.deltaY*.0015);limitaEX()},{passive:false});
/* na exploração, mostra-se o mundo inteiro mesmo que a cena esteja numa vinheta */
{const _dv=desenhaVinhetas;desenhaVinhetas=function(t){if(explorando&&cena&&cena.mundo){vista(cena.mundo,novaCam(),{x:0,y:0,w:W,h:H},t);return}return _dv(t)}}

/* ---------- a câmara ---------- */
{const _v=vista;
  vista=function(mundo,cm,rect,t,ez){
    const ecraTodo=cena&&mundo===cena.mundo&&rect.w===W&&rect.h===H;
    if(explorando&&ecraTodo){const r=_v(mundo,novaCam({x:EX.x,y:EX.y,z:EX.z}),rect,performance.now()/1000,1);posMarcas(mundo);return r}
    if(ecraTodo&&!vinhetas&&!pausado){OLHAR.x=lerp(OLHAR.x,OLHAR.ax,.035);OLHAR.y=lerp(OLHAR.y,OLHAR.ay,.035);
      cm=Object.assign({},cm,{x:cm.x+OLHAR.x*.028/Math.max(1,cm.z),y:cm.y+OLHAR.y*.02/Math.max(1,cm.z),r:(cm.r||0)+OLHAR.x*.004})}
    return _v(mundo,cm,rect,t,ez)};}
function posMarcas(m){const s=Math.max(H/m.H,W/m.W)*EX.z*1.06,vw=W/s,vh=H/s;
  const px=clamp(EX.x*m.W,vw/2,m.W-vw/2),py=clamp(EX.y*m.H,vh/2,m.H-vh/2);
  marcasEl.querySelectorAll('.marca').forEach(el=>{const n=NOTAS.get(m)[+el.dataset.i];el.style.left=(W/2+(n.x*m.W-px)*s)+'px';el.style.top=(H/2+(n.y*m.H-py)*s)+'px'})}

</script>
